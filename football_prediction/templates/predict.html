{% extends "base.html" %}
{% block title %}Predict{% endblock %}
{% block content %}

<div class="section-head">
  <span class="eyebrow">{{ match.kickoff_at.strftime('%a %d %b, %H:%M') }}</span>
  <h1>{{ match.home_team }} vs {{ match.away_team }}</h1>
  <p>Enter the final score you predict.</p>
</div>

<div class="form-card">
  <form method="POST">
    <div class="score-inputs">
      <div class="field">
        <label for="home_score">{{ match.home_team }}</label>
        <input type="number" id="home_score" name="home_score" min="0" value="{{ existing.predicted_home_score if existing is not none else '' }}" required>
      </div>
      <div class="score-vs">&ndash;</div>
      <div class="field">
        <label for="away_score">{{ match.away_team }}</label>
        <input type="number" id="away_score" name="away_score" min="0" value="{{ existing.predicted_away_score if existing is not none else '' }}" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block mt-32">Save prediction</button>
  </form>
</div>

<p class="form-foot"><a href="{{ url_for('dashboard') }}">&larr; Back to fixtures</a></p>

{% endblock %}
