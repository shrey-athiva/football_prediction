{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="form-card">
    <span class="eyebrow">Join the pool</span>
    <h1>Create your account</h1>
    <form method="POST" class="mt-32">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
